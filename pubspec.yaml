name: novo9oito_motorista
description: "Aplicativo 9Oito para motoristas parceiros."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.0.0
  geocoding: ^4.0.0
  firebase_auth: ^6.0.1
  firebase_database: ^12.0.0
  firebase_storage: ^13.0.0
  intl: ^0.20.2
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  image_picker: ^1.2.0
  camera: ^0.11.2
  google_maps_flutter: ^2.12.3
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.3
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/arrow_icon.png
    - assets/images/
    - assets/icons/

